<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Korea Trip Checklist</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f5f1;color:#1f2521;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(760px,100%);margin:auto;padding:18px 16px 42px}.hero,.card{background:#fff;border:1px solid rgba(31,37,33,.07);box-shadow:0 10px 30px rgba(31,37,33,.05);border-radius:22px}.hero{padding:22px;margin-bottom:14px;background:linear-gradient(145deg,#fbfcf9,#eef4ee)}h1{font-size:28px;margin:4px 0 8px}h2{margin:4px 0 14px}.eyebrow{margin:0;color:#728078;font-size:11px;font-weight:800;letter-spacing:.12em}.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}.tabs button{white-space:nowrap;border:0;border-radius:14px;background:#fff;padding:10px 14px;font-weight:700;color:#637067;box-shadow:0 4px 16px rgba(31,37,33,.05)}.tabs button.active{background:#1f7a4f;color:#fff}.card{padding:18px;margin-bottom:14px}.section-note{font-size:13px;color:#6a776f;background:#fff8e9;border-radius:12px;padding:10px 12px}.item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #edf0ec}.item:last-child{border-bottom:0}.item input{width:20px;height:20px;margin-top:1px;accent-color:#1f7a4f}.item label{flex:1;line-height:1.45}.progress{height:10px;background:#e7ebe6;border-radius:999px;overflow:hidden;margin:10px 0 6px}.progress>div{height:100%;background:#1f7a4f}.summary{color:#657168;font-size:13px}.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:700;background:#eef1ed;color:#253028;text-decoration:none}.btn.primary{background:#1f7a4f;color:white}.day-note{color:#647067;font-size:13px;margin-top:-4px}.done{text-decoration:line-through;color:#8a948d}@media(max-width:520px){.wrap{padding:12px}.hero,.card{border-radius:18px}h1{font-size:24px}}
  </style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <p class="eyebrow">KOREA TRIP · CHECKLIST</p>
    <h1>🧳 出行清单</h1>
    <p>总行李清单 + 每天出发前检查。勾选状态会保存在当前手机浏览器。</p>
    <div class="top-actions">
      <a class="btn primary" href="/">← 返回旅行助手</a>
      <button class="btn" id="resetBtn">清空当前页勾选</button>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
</div>
<script>
const packing = [
  {title:'入境 / 证件',items:['护照','机票 / 航班信息','酒店订单 / 地址']},
  {title:'洗护服装',items:['牙膏 / 牙刷','一次性毛巾 ×14','一次性内裤 ×17（一人多备一条）','袜子 ×7','衣物 7 天','防晒衣或外套 ×2','防晒霜','雨衣','墨镜','保鲜袋 ×6','洗面奶 / 面霜','防晒口罩','太阳帽','卸妆油']},
  {title:'电子设备',items:['转换头','充电宝 ×2','数据线（手机及手表）','运动相机 / 拍立得 / 相机','流量卡 / 卡针']},
  {title:'药品',note:'出发前确认药品与充电宝等物品的航空携带规则。',items:['晕车药','肠胃药（蒙脱石散 / 肠炎宁等）','碘伏棉签']},
  {title:'生活用品',items:['垃圾袋 ×7','奶茶袋（装奶茶 / 雨伞）','笔','搓澡巾','耳塞','抽纸 ×1 / 手帕纸 ×5','湿厕纸 ×1']},
]
const daily = {
  '09/26': ['护照 / 手机 / 钱包','流量卡已可用','充电宝 + 数据线','防晒霜 / 墨镜 / 太阳帽','雨衣或轻薄外套','确认酒店地址与机场 → I-Jin 导航'],
  '09/27': ['护照（牛岛乘船）','确认牛岛船班与末班船','防晒霜 / 太阳帽 / 墨镜','雨衣或防风外套','充电宝 + 手机电量','水 + 能量零食','确认行李配送交接状态','穿适合徒步 / 骑行的鞋袜'],
  '09/28': ['根据 Plan A/B 决定是否早起看日出','退房前完成行李配送交接','水 + 碳水早餐 + 能量零食','防晒霜 / 太阳帽 / 墨镜','雨衣或轻薄外套','充电宝 + 手机电量','检查鞋袜与脚部状态','确认 Route 7 最新路线 / 临时改道'],
  '09/29': ['早餐吃够碳水 + 蛋白质','至少准备充足饮水 + 能量零食','防晒霜 / 太阳帽 / 墨镜','雨衣或防风外套','充电宝 + 手机电量','检查鞋袜 / 脚部 / 膝盖状态','确认 Route 8 最新路线 / 临时改道','中段记得做补水与腿部状态检查'],
  '09/30': ['退房前完成 Hotel Bridge → I-Jin 行李配送交接','早餐吃够碳水','水 + 能量零食','防晒霜 / 太阳帽 / 墨镜','雨衣或轻薄外套','充电宝 + 手机电量','检查鞋袜与脚部状态','确认 Route 10 最新路线 / 临时改道','确认龙头海岸开放状态（仅作为可选）','确认徒步结束后的返城公交 / Taxi 备选']
}
const views=[{id:'packing',label:'总行李'},...Object.keys(daily).map(d=>({id:d,label:d}))]
let active=localStorage.getItem('checklist-active')||'packing'
const key=()=>`korea-trip-checklist:${active}`
const load=()=>JSON.parse(localStorage.getItem(key())||'{}')
const save=s=>localStorage.setItem(key(),JSON.stringify(s))
function renderTabs(){tabs.innerHTML='';views.forEach(v=>{const b=document.createElement('button');b.textContent=v.label;b.className=v.id===active?'active':'';b.onclick=()=>{active=v.id;localStorage.setItem('checklist-active',active);render()};tabs.appendChild(b)})}
function renderItems(items,prefix,title,note){const state=load();const section=document.createElement('section');section.className='card';section.innerHTML=`<h2>${title}</h2>${note?`<p class="section-note">${note}</p>`:''}`;items.forEach((text,i)=>{const id=`${prefix}-${i}`;const row=document.createElement('div');row.className='item';const checked=!!state[id];row.innerHTML=`<input id="${id}" type="checkbox" ${checked?'checked':''}><label for="${id}" class="${checked?'done':''}">${text}</label>`;row.querySelector('input').onchange=e=>{const s=load();s[id]=e.target.checked;save(s);renderContent()};section.appendChild(row)});return section}
function renderContent(){content.innerHTML='';let groups=[];if(active==='packing') groups=packing.map((g,i)=>({items:g.items,prefix:`p${i}`,title:g.title,note:g.note})); else groups=[{items:daily[active],prefix:'d',title:`${active} · 出发前 Checklist`,note:'当天出门前快速过一遍；易变化信息以当日实际情况为准。'}];const state=load();let total=0,done=0;groups.forEach(g=>{total+=g.items.length;g.items.forEach((_,i)=>{if(state[`${g.prefix}-${i}`])done++})});const summary=document.createElement('section');summary.className='card';summary.innerHTML=`<p class="eyebrow">完成进度</p><div class="progress"><div style="width:${total?done/total*100:0}%"></div></div><div class="summary">${done} / ${total} 已完成</div>`;content.appendChild(summary);groups.forEach(g=>content.appendChild(renderItems(g.items,g.prefix,g.title,g.note)))}
function render(){renderTabs();renderContent()}
resetBtn.onclick=()=>{localStorage.removeItem(key());renderContent()}
render()
</script>
</body>
</html>
